<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercise 8</title>
    <style>
        .box {
            height: 70px;
            width: 70px;
            background-color: red;
            border-radius: 100px;
            position: absolute;
            bottom: 0;
            left: 0;
           animation: karthik 4s linear alternate forwards 2s 1;
        }

        .container {
            position: relative;
            height: 90vh;
            width: 90vw;
            background-color: blue;
        }

        @keyframes karthik {
            0% {
                transform: translate(0px, 0px);
            }

            20% {
                transform: translate(100px, -300px);
            }

            40% {
                transform: translate(200px, 0px);
            }

            55% {
                transform: translate(275px, -220px);
            }

            70% {
                transform: translate(350px, -0px);
            }

            82% {
                transform: translate(400px, -120px);
            }

            100% {
                transform: translate(500px, 0px);
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="box">
        </div>
    </div>
</body>

</html>
