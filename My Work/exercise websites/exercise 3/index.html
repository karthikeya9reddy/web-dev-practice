<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= , initial-scale=1.0">
    <title>card.png</title>
    <style>
        body {
            background-color: grey;
        }

        .box {
            border-radius: 7px;
            width: 198px;
            height: 350px;
            background-color: white;
        }

        .box:hover {
            background-color: #82C9CF;
        }

        .img {
            border-radius: 10px;
            padding: 5px;
        }

        .img img {
            border-radius: 7px;
        }

        .content {
            padding: 7px;
            font-size: small;
            color: grey;
        }

        .content h1 {
            color: black;
        }

        .capsules {
            padding: 9px;
        }

        .capsules span {
            border: 2px solid grey;
            border-radius: 9px;
        }
        .capsules span:hover{
            background-color: yellow;
        }

        .footer {
            border: 2px;
            border-radius: 9px;
            background-color: rgb(166, 166, 251);
            color: blue;
            text-align: center;
        }
        .footer:hover{
            color: black;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="img">
            <img width="188" src="ssh.png" alt="">
        </div>
        <div class="capsules">
            <span>one piece</span>
            <span>info</span>
            <span>characters</span>
        </div>
        <div class="content">
            <h1>one piece</h1>
            <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Deleniti sunt dolorum voluptatibus cumque illo
                numquam nihil eius voluptas suscipit ex? Animi nesciunt </p>
        </div>
        <div class="footer">
            Read more
        </div>
    </div>


</body>

</html>
