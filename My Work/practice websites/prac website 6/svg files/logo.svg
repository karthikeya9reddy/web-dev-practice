<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 220 60"
     width="220"
     height="60">

    <!-- Upside-down Spotify-style symbol -->
    <g transform="translate(30 30) rotate(180)">
        <circle cx="0" cy="0" r="24" fill="#1DB954"/>

        <path
            d="M-15 -6
               C-7 -10 7 -10 15 -6"
            fill="none"
            stroke="#000"
            stroke-width="4"
            stroke-linecap="round"/>

        <path
            d="M-13 2
               C-6 -1 6 -1 13 2"
            fill="none"
            stroke="#000"
            stroke-width="4"
            stroke-linecap="round"/>

        <path
            d="M-10 9
               C-5 7 5 7 10 9"
            fill="none"
            stroke="#000"
            stroke-width="4"
            stroke-linecap="round"/>
    </g>

    <!-- Spootitify text -->
    <text
        x="62"
        y="39"
        fill="white"
        font-family="Arial, Helvetica, sans-serif"
        font-size="27"
        font-weight="700"
        letter-spacing="-1">
        Spootitify
    </text>

</svg>

