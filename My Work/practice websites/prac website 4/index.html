<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squid game application</title>
</head>
<style>
        div:hover{
        background-color: rgb(205, 200, 200);
        color: rgb(158, 1, 1);
    }
    article:hover{
        background-color: rgb(82, 83, 81);
    }

    .submit:hover{
        background-color: yellow;
        color: black;
    }

</style>

<body>
    <header>
        <center>
            <h1>
                <u>
                    <i style="color: rgb(232, 15, 15);">Application</i> <i>for</i> <i style="color: purple;">Squid</i>
                    <i>game</i> <i style="color: rgb(232, 15, 15);">season</i> <i>4</i>
                </u>
            </h1>
        </center>
    </header>
    <main>
        <form action="post">
            <div>
                <label for="username">Name: </label>
                <input type="text" id="username" name="username" placeholder="Enter your Name">
            </div>
            <br>

            <div>
                <label for="age">Age:</label>
                <input type="number" id="age" name="age" placeholder="Enter your Age">
            </div>
            <br>

            <div>
                <label for="">Gender: </label>
                <label for="male">Male</label>
                <input type="radio" id="male" name="gender" value="male">
                <label for="female">Female</label>
                <input type="radio" id="female" name="gender" value="female">
            </div>
            <br>

            <div>
                <label for="workingstatus">Current working status: </label>
                <select name="working status" id="workingstatus">
                    <option value="employed">Employed</option>
                    <option value="umemployed">Unemployed</option>
                    <option value="student">Student</option>
                </select>
            </div>
            <br>

            <div>
                <label for="">Have you participated in squid game before: </label>
                <label for="yes">Yes</label>
                <input type="radio" id="yes" name="conformation" value="yes">
                <label for="no">No</label>
                <input type="radio" id="no" name="conformation" value="no">
            </div>
            <br>

            <div>
                <label for="">Enter your contact details:-</label>
                <br>
                <br>
            </div>
            <article>
                <label for="number">enter your ph.no: </label>
                <input class="num" type="number" id="number" name="phone number">
                <br>
                <br>
            </article>
            <article>
                <label for="email">enter your email id: </label>
                <input type="email" id="email" name="email">
            </article>
            <br>
            <br>

            <div>
                <label for="comment">ask any questions regarding the game here: </label>
                <br>
                <textarea name="comment" id="comment" rows="15" cols="50"></textarea>
            </div>
            <br>

                <input class="submit" type="submit" name="submit" value="submit">
        </form>
    </main>
</body>

</html>
