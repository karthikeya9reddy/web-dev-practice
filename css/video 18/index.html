<!-- summary of the video 

Key Concepts Covered:

Inline vs. Block Elements: The video explains that some elements (like div) are block-level by default, taking up the full width, while others (like span) are inline. You can change these behaviors using display: inline or display: block (0:45).

Inline-Block: A crucial property that allows elements to sit side-by-side (like inline) while still respecting width, height, margin, and padding settings (5:05).

Hiding Elements:
display: none: Removes the element and its space from the layout entirely (6:43).

visibility: hidden: Hides the element but keeps the space it occupies preserved (7:32).

Modern Layouts: The tutorial introduces display: flex and display: grid for creating responsive, modern layouts. It demonstrates how justify-content: center works within a flex container to align elements (8:04).

The instructor emphasizes learning only what is necessary for practical web development and encourages viewers to check the provided documentation for an exhaustive list of properties (9:31). -->
