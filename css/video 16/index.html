<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css selectors</title>
    <style>
        /* this tag is for all the divs  */
        div {
            /* background-color: red; */
        }

        /* class selector */
        .red {
            background-color: red;
        }

        /* id selector */
        #green {
            background-color: green;
        }

        /* child selectors */
        div>p {
            background-color: aqua;
            color: pink;
        }
        /* descendant selectors */
        div p{
            background-color: brown;
        }
        /* '*'---> is the universal selector */
         *{
            margin: 0;
            padding: 0;
         }
         
         /* pseudo selector */
          a:visited{                      /*--> were you visited */
            color: red;
         }

          a:link{                         /*--> were you didnt visited */
            color: rgb(6, 162, 40);
         }

         a:active{                        /*when you are clicking */
            background-color: yellow;
         }

         a:hover{
            background-color: blueviolet;
            color: aqua;
         }

         p:first-child{
            background-color: aqua;
         }
         
    </style>
</head>

<body>
    <div class="one">
    <p>i am first</p>
    <p>i am second</p>
    </div>
    <div class="red">
        im a div
        <article>
            <p>im a para inside a div </p>
        </article>
    </div>

    <div id="green">
        im a second div
    </div>
    <div>
        <a target="_blank" href="https://www.google.com">go to google</a>
        <a target="_blank" href="https://www.Facebook.com">go to facebook</a>
    </div>
</body>

</html>
