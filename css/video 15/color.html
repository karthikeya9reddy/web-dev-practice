<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>colors</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* to find out more colors types visit the following website */
       /* https://codepen.io/web-dot-dev/pen/ZELGraM */

    h1{
    /* using color keyword colors ----> */ color: yellow;
    /* using hex colors           ---->  color: #B04141; */ 
    /* using rgb colors           ---->  color: rgb(39, 70, 65); */
    /* using rgba colors          ---->  color: rgba(85, 93, 67, 0.888); */
     /* using rgb colors          ---->  color: hsla(235, 100%, 50%, 0.424);*/
     background-color:#B04141; ;
    }

    ol{
        text-transform: uppercase;
    }

    </style>
</head>
<body>
    <h1>lets learn about colors</h1>
    <p>
        color can be represented in:
        <ol>
            <li>color keywords</li>
            <li>hex color code</li>
            <li>rgb</li>
            <li>rgba</li>
            <li>hsl</li>
        </ol>
    </p>
</body>
</html>
