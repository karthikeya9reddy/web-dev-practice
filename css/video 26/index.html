        /* psuedo elements */

         .boxes::before{
            content: "karthik is very good";
         }

         .boxes::after{
            content: "sigma course is also good";
         }

         /* selection selector */
         ::selection{
            color: yellow;
            background-color: red;
         }

         .box::first-letter{
            color: lime;
            font-size: 45px;
         }

         input::placeholder{
            color: blue;
         }
    </style>
</head>

<body>
    <div class="boxes">
        <div data-color="primary" class="box">i am first box</div>
        <div class="box">hey im a box</div>
        <div class="box">hey im a box</div>
        <div class="box">hey im a box</div>
