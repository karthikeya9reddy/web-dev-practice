<!-- summary of the video 

1. JavaScript Events:
Browser Events: Signals that occur in the browser (e.g., clicking a button, hovering, pressing keys). They allow code to react to user interactions (1:04).

addEventListener: A method used to listen for specific events on an element. It takes two arguments: the event type (like 'click', 'dblclick', 'contextmenu') and a callback function to execute (2:04).

Event Object: The function provided to an event listener receives an event object, which contains data about the interaction, such as the key pressed or cursor coordinates (8:06).

2. Event Bubbling:
Event Bubbling: When an event is triggered on an element, it propagates upward through its parent elements. Clicking a child element also triggers click handlers on its parents (14:11).

stopPropagation: A method called on the event object (e.stopPropagation()) that prevents the event from 'bubbling' up to parent elements (17:15).

3. Timing Functions:
setInterval: Executes a function repeatedly after a specified time interval (in milliseconds) (22:37).

clearInterval: Stops the execution of a setInterval timer using the unique ID returned when it was created (24:34).

setTimeout: Executes a function once after a specified delay (25:24).

clearTimeout: Cancels a setTimeout function before it executes (26:12). -->
