<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css filters</title>
    <style>
        /* img{
            filter: blur(2px);
        } */

        .img1{
              filter: brightness(122%) contrast(100%);
        }

        .img2{
            filter: invert(0.1) opacity(1);
        }

        .img3{
            filter: grayscale(20%);
        }

    </style>
</head>
<body>
    <div class="container">
        <img class="img1" width="500px" src="https://images.unsplash.com/photo-1575936123452-b67c3203c357?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8aW1hZ2V8ZW58MHx8MHx8fDA%3D" alt="">

        <img class="img2" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR285GZwO7cBYvwoKCXmQcXCpK1vZw2YeomzCUMOqw-bmRnsqu3qrUPfQMr&s=10" alt="">

        <img class="img3" src="https://images.forbesindia.com/blog/wp-content/uploads/media/images/2017/Dec/img_102081_prabhas.jpg" alt="">
    </div>
</body>
</html>
