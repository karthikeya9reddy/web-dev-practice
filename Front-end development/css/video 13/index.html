<!-- summary of the video

This video serves as a masterclass on CSS selectors, which are essential tools for targeting HTML elements to apply
styling. The instructor covers several fundamental types of selectors:

Element Selector: Targets elements by their tag name (e.g., div), though it applies styles to all such elements (02:00).
Class Selector: Uses a dot notation (.className) to target specific elements assigned a class, offering more control
(03:24).
ID Selector: Uses the #idName syntax to target a unique element with a specific ID (04:00).
Child Selector: Targets an element only if it is a direct child of another element using the > symbol (04:45).
Descendant Selector: Targets an element nested anywhere inside another (even through multiple parent levels) using a
space separator (06:28).
Universal Selector: Denoted by *, it applies styles to every element on the page, often used for resetting margins and
padding (07:05).
Pseudo Selectors: Allow styling based on states or positions, such as :hover, :visited, :active, or :first-child (08:02
- 12:46).
The instructor emphasizes that mastering these core selectors is fundamental for web development, as they are used in
the vast majority of real-world website styling. -->
