<!-- summary of the video 

Key Concepts Covered:

Static Position (0:39): The default value. Elements follow the normal document flow and ignore top, bottom, left, right, and z-index properties.

Relative Position (4:30): Allows you to shift an element from its original position using top, bottom, left, and right without affecting the layout of surrounding elements. It also enables the use of z-index.

Absolute Position (8:21): Removes an element from the normal document flow. It is positioned relative to its nearest positioned ancestor (an element with position other than static). If no such ancestor exists, it positions relative to the body or html element.

Fixed Position (12:50): Positions an element relative to the viewport (the browser window). The element remains in the same spot even when the page is scrolled.

Sticky Position (15:06): A hybrid between relative and fixed. The element behaves like static until the user scrolls to a specified threshold, at which point it "sticks" in place relative to its parent.

Important Exceptions:
The video highlights an advanced concept at (19:11): using transform, filter, or perspective properties on a parent element can also make that parent act as a positioning context for its children, even if the parent has position: static. -->
