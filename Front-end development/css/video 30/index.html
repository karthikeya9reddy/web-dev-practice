<!-- sumamry of the video 

Key concepts covered include:

Core Properties: Transitions are built from four distinct sub-properties: transition-property, transition-duration, transition-timing-function, and transition-delay (3:36-4:01).

Shorthand Syntax: Instead of writing every property individually, you can combine them into a single transition shorthand property to save time and code (6:07-6:30, 10:30-10:52).

Multiple Properties: You can animate multiple properties at once (such as background-color and transform) by using comma-separated values or the all keyword (7:15-8:06).

Timing Functions: These define the speed curve of the animation. The video demonstrates how to use built-in functions like ease-in-out and create custom animations using the cubic-bezier curve in browser developer tools (8:21-9:40, 11:34-12:13). -->
