<!-- summary of the video 

This video from the Sigma Web Development Course provides a comprehensive guide to the CSS Box Model, which is fundamental to understanding how layout works in web design. Every HTML element acts as a rectangular box, and this tutorial breaks down the essential components that shape these boxes:

Content: The innermost part of the box where text or images reside (1:48).
Padding: The transparent space inside the border, separating content from the border (2:16, 5:45).
Border: The line that wraps around the content and padding (2:16, 8:22).
Margin: The outermost layer, creating space between the element and its neighbors (2:16, 7:28).
Key concepts covered:

Box Sizing: The instructor explains how box-sizing: border-box changes how width and height are calculated. By default, padding and borders add to an element's size; this property ensures the defined dimensions include padding and borders, making layouts much easier to manage (10:30, 11:38).
Margin Collapse: A common CSS behavior where the vertical margins of two adjacent elements do not add up. Instead, the larger of the two margins is used to define the space between them (14:50 - 15:55).
Browser Defaults: The importance of using a universal selector (e.g., * { margin: 0; padding: 0; }) to reset default browser styling for more predictable layouts (3:02).
