<!-- summary of the video 

Key CSS Properties Explained
object-fit: Used to define how an image (or video) is resized to fit its container.

cover: Scales the image to fill the container entirely while maintaining its aspect ratio. This often results in clipping parts of the image (03:17).

contain: Scales the image to ensure the entire image is visible within the container, maintaining the aspect ratio, but may leave empty space (05:15).

fill: The default value; it stretches the image to fill the container, which can cause distortion (07:05).

scale-down: Shrinks the image to the smaller size between contain and the original image size (07:21).

object-position: Determines the alignment of the image within its container (e.g., top right, bottom right, or percentage values like 50% 50%) (06:08).

Background Properties
When using an image as a background instead of an `` tag, the following properties control its display:

background-image: Sets the image source using url() (09:33).

background-position: Aligns the background image, similar to object-position (10:12).

background-repeat: Controls if the image repeats. Use no-repeat to prevent tiling (12:01).

background-clip: Determines how far the background extends (e.g., border-box, padding-box) (13:03). -->
