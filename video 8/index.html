<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>everything about video</title>
</head>

<body>
    <!--how to add a video in html-->
    <div>
        <h3>
            <caption>adding video in html</caption>
        </h3>
    </div>
    <video src="Video1.mp4" height="255" controls autoplay muted loop poster="ssh.png"></video>

    <!--how to add audio file in html-->
    <div>
        <h3>
            <caption>adding audio in html</caption>
        </h3>
    </div>
    <div><audio src="audio1.mp3" controls muted autoplay loop></audio></div>

    <!--how to add a svg file in html also in img file-->
    <div>
        <h3>
            <caption>adding svg files in html</caption>
        </h3>
    </div>
    <svg height="100" width="100">
        <circle cx="50" cy="50" r="40" stroke="black" stroke-width="3" fill="red" />
    </svg>
    <img src="img.svg" alt="my svg file">

    <!--how to add iframe in html-->
    <div>
        <h3>
            <caption>adding iframes in html</caption>
        </h3>
    </div>
    <div><iframe src="https://en.wikipedia.org/wiki/Coding_(social_sciences)" width="500" height="255"></iframe></div>

    <!--adding iframe youtube videos-->
    <div>
        <h3>
            <caption>adding iframe from youtubein html</caption>
        </h3>
    </div>
    <div><iframe width="560" height="315" src="https://www.youtube.com/embed/XZwBNDGuWGU?si=sYUfhM7wnvsyLLGL&amp;start=797" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
</body>

</html>
